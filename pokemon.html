<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="container">
        <a href="/" class="Logo">
            <img src="img/Logo_Pokedex.png" alt="Logo_Pokedex">
        </a>
        <form>
            <div class="form-group">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="icon-search">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                </svg>
                <input type="search" placeholder="Buscar nombre de Pokemon">
            </div>
            <button class="btn-search">Buscar</button>
        </form>
    </header>
    <main class="container main-pokemon">
        <div class=" header-main-pokemon">
            <span class=" number-pokemon">#1</span>
            <div class="container-img-pokemon">
                <img src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/001.png"
                    alt="Pokemon Bulbasaur">
            </div>
            <div class=" container-info-pokemon">
                <h1>Bulbasaur</h1>
                <div class="card-types">
                    <span class="grass">Planta</span>
                </div>
                <div class="container-info-pokemon">
                    <div class="group-info">
                        <p>Altura </p>
                        <span>0.7m</span>
                    </div>
                    <div class=" group-info">
                        <p>Peso</p>
                        <span>6.9Kg</span>

                    </div>
                </div>
            </div>
        </div>
        <div class="container-stats">
            <h1>Estadisticas</h1>
            <div class="stats">
                <div class="stat-group"></div>
                <span>Hp</span>
                <div class="progress-bar"></div>
                <span class="counter-stat">45</span>
            </div>
        </div>
            <div class="stats">
                <div class="stat-group"></div>
                <span>Attack</span>
                <div class="progress-bar"></div>
                <span class="counter-stat">49</span>
            </div>
        </div>
            <div class="stats">
                <div class="stat-group"></div>
                <span>Defense</span>
                <div class="progress-bar"></div>
                <span class="counter-stat">49</span>
            </div>
        </div>
            <div class="stats">
                <div class="stat-group"></div>
                <span>S.Attack</span>
                <div class="progress-bar"></div>
                <span class="counter-stat">65</span>
            </div>
        </div>
            <div class="stats">
                <div class="stat-group"></div>
                <span>S.Defense</span>
                <div class="progress-bar"></div>
                <span class="counter-stat">65</span>
            </div>
        </div>
            <div class="stats">
                <div class="stat-group"></div>
                <span>Speed</span>
                <div class="progress-bar"></div>
                <span class="counter-stat">45</span>
            </div>
        </div>
    </main>
</body>

</html>
