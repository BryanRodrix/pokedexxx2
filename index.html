<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeMMO</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="container">

        <a href="/" class="Logo">
            <img src="img/Logo_Pokedex.png" alt="Logo_Pokedex">
        </a>

        <!-- BUSCADOR -->
        <form id="searchForm">

            <div class="form-group">

                <svg xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                    class="icon-search">

                    <path stroke-linecap="round"
                        stroke-linejoin="round"
                        d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />

                </svg>

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Buscar nombre de Pokemon"
                    autocomplete="off">

            </div>

            <button type="submit" class="btn-search">
                Buscar
            </button>

        </form>

    </header>


    <!-- CONTENEDOR PRINCIPAL -->
    <div class="page-layout">


        <!-- FILTROS -->
        <aside class="container-filters">

            <div class="filter-by-type">

                <span>Tipo</span>

                <div class="group-type">
                    <input type="checkbox" name="grass" id="grass">
                    <label for="grass">Planta</label>
                </div>

                <div class="group-type">
                    <input type="checkbox" name="poison" id="poison">
                    <label for="poison">Veneno</label>
                </div>

                <div class="group-type">
                    <input type="checkbox" name="fire" id="fire">
                    <label for="fire">Fuego</label>
                </div>

                <div class="group-type">
                    <input type="checkbox" name="flying" id="flying">
                    <label for="flying">Volador</label>
                </div>

                <div class="group-type">
                    <input type="checkbox" name="water" id="water">
                    <label for="water">Agua</label>
                </div>

                <div class="group-type">
                    <input type="checkbox" name="bug" id="bug">
                    <label for="bug">Bicho</label>
                </div>

                <div class="group-type">
                    <input type="checkbox" name="normal" id="normal">
                    <label for="normal">Normal</label>
                </div>

                <div class="group-type">
                    <input type="checkbox" name="electric" id="electric">
                    <label for="electric">Eléctrico</label>
                </div>

                <div class="group-type">
                    <input type="checkbox" name="ground" id="ground">
                    <label for="ground">Tierra</label>
                </div>

                <div class="group-type">
                    <input type="checkbox" name="fairy" id="fairy">
                    <label for="fairy">Hada</label>
                </div>

            </div>

        </aside>


        <!-- LISTA DE POKÉMON -->
        <!-- IMPORTANTE: id="listaPokemon" -->
        <main
            id="listaPokemon"
            class="card-list-pokemon container">
        </main>

    </div>


    <!-- MODAL -->
    <div id="modalOverlay" class="modal-overlay">

        <div class="modal-card">

            <button id="closeModal" class="close-btn">
                X
            </button>

            <img
                id="modalImg"
                class="modal-img"
                src=""
                alt="Pokémon">

            <h2
                id="modalTitle"
                class="modal-title">
            </h2>

            <p
                id="modalId"
                class="modal-id">
            </p>

            <div
                id="modalTypes"
                class="card-types">
            </div>

            <div
                id="modalStats"
                class="modal-stats">
            </div>

        </div>

    </div>


    <!-- MODAL SECUNDARIO -->
    <div
        id="pokemon-modal"
        class="modal"
        style="display: none;">
    </div>


    <!-- JAVASCRIPT -->
    <script src="app.js"></script>

</body>

</html>
